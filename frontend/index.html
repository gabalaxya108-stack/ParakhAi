<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="description" content="PARAKH AI is a government-grade AI-assisted platform for automated inspection and compliance verification of packaged commodities under the Legal Metrology (Packaged Commodities) Rules, 2011. Built for the Department of Consumer Affairs, Government of India." />
    <title>PARAKH AI | AI-Assisted Legal Metrology Compliance & Inspection Platform</title>
    <!-- Blocking script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('parakh_theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
